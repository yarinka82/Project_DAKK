<!doctype html>
<html lang="en" :lang="$store.locale.current" x-data="localization">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project</title>
</head>

<body data-page="project-single">
  <load src="./src/partials/header.html" />


  <main id="singleProject" x-data="loadSingleProject()" x-init="$watch('$store.locale.current', () => init())">


    <section>

      <div class="container container-100">

        <!-- Cover -->
        <!--  <img x-show="project?.cover" :src="project?.cover" /> -->

        <!-- Hero -->
        <div class="container container-100 project-grey">
          <section class="project-hero" :style="project?.cover ? `background-image: url(${project.cover})` : ''">

          </section>


          <!-- Main Details -->
          <section class="main-details">
            <div class="main-details-content">
              <div class="container main-details-content-1">
                <h1 x-text="project?.projectName" class="project-h1"></h1>
                <h4><a x-show="project?.siteUrl" :href="project?.siteUrl" x-text="project?.siteUrl"></a></h4>
                <h2 x-text="project?.category?.name"></h2>
              </div>

              <div class="container main-details-content-2">
                <div class="project-details-column">
                  <div>
                    <p x-text="project?.country"></p>
                    <p x-text="project?.city?.name"></p>
                  </div>
                  <div>
                    <p x-text="project?.area ? 'Площа' : ''"></p>
                    <p x-text="project?.area ? project.area + ' м²' : ''"></p>
                  </div>
                </div>

                <div class="project-details-column">
                  <div>
                    <p x-text="project?.timeline ? 'Рік роботи' : ''"></p>
                    <p x-text="project?.timeline
                  ? (project.timeline.yearStart && project.timeline.yearEnd
                  ? project.timeline.yearStart + ' - ' + project.timeline.yearEnd
                  : (project.timeline.yearStart ?? project.timeline.yearEnd))
                  : ''"></p>
                  </div>
                  <div>
                    <p x-text="project?.status ? 'Статус' : ''"></p>
                    <p x-text="project?.status ? project.status : ''"></p>
                  </div>
                </div>

              </div>
            </div>
          </section>
        </div>


        <!-- Description -->
        <div class="container container-100">
          <section class="project-description p-40-50">
            <p x-text="project?.description"></p>
          </section>
        </div>

        <div class="project-divider">
          <p></p>
        </div>

        <!-- Deatils -->
        <div class="container container-100">
          <section class="project-details p-40-50">
            <div class="project-details-1">

              <template x-if="project?.supplier?.length">
                <div>
                  <p>
                    <span class="project-details-header"
                      x-text="project?.supplier.length == 1 ? 'Замовник: ' : 'Замовники: '"></span>
                    <span x-show="project?.supplier.length == 1" x-text="project?.supplier[0].name"></span>
                    <!-- <span x-text="project?.supplier.map(s => s.name).join(', ')"></span> -->
                    <span class="project-supplier-list" x-show="project?.supplier.length > 1">
                      <template x-for="s in project.supplier">
                        <li x-text="s.name"></li>
                      </template>
                    </span>
                  </p>
                </div>
              </template>

              <p>
                <span class="project-details-header"
                  x-text="project?.generalDesigner?.name ? 'Генпроектувальник: ' : ''"></span>
                <span><a x-show="project?.generalDesigner" :href="project?.generalDesigner?.link" target="_blank" alt=""
                    class="project-link">
                    <span x-text="project?.generalDesigner?.name"></span>
                  </a></span>
              </p>


            </div>

            <div class="project-details-2">
              <p>
                <span class="project-details-header">Код категорії: </span>
                <span x-text="project?.consequenceClass"></span>
              </p>
              <p>
                <span class="project-details-header">Конструктив: </span>
                <span x-text="project?.constructive"></span>
              </p>
            </div>

            <div class="project-details-3">
              <p class="project-pdf-link">
                <span class="project-details-header">Паспорт об'єкта:</span>
                <a x-show="project?.linkDocuments" :href="project?.linkDocuments" target="_blank" alt=""
                  class="project-link">
                  <img src="/images/pdf_icon.jpg" width="30px" />
                </a>
              </p>
            </div>
          </section>
        </div>

        <!--Web and Gallery-->
        <div class="container container-100 project-light-grey p-40-50"
          x-show="project?.siteUrl || project?.photo?.length">
          <section class="project-website">
            <a x-show="project?.siteUrl" :href="project?.siteUrl" class="project-link-white">
              Перейти на сайт: <span x-text="project?.siteUrl"></span>
            </a>

            <!-- Gallery -->


            <section class="project-gallery" x-show="project?.photo?.length">
              <div class="project-gallery-wrapper">
                <button @click="galleryData.prev()" class="project-arrow left"
                  x-show="(galleryData.isMobile && galleryData.photos.length > 1)">
                  &lt;
                </button>

                <div class="project-gallery-track" x-ref="track">
                  <template x-for="(img, index) in galleryData.photos" :key="index">
                    <img class="project-thumbnail" :src="img" :class="{'active': index === galleryData.activeIndex}"
                      @click="galleryData.openModal(img)" />
                  </template>
                </div>

                <button @click="galleryData.next()" class="project-arrow right"
                  x-show="(galleryData.isMobile && galleryData.photos.length > 1)">&gt;</button>
              </div>

              <template x-if="galleryData.activeImage">
                <div class="project-modal" @click="galleryData.closeModal()">
                  <div class="project-image-wrapper">
                    <button @click.stop='galleryData.prev()' class="project-arrow left"
                      x.show="project?.photo?.length > 1">&lt;</button>
                    <img :src="galleryData.activeImage" />
                    <button @click.stop='galleryData.next()' class="project-arrow right"
                      x.show="project?.photo?.length > 1">&gt;</button>
                  </div>
                </div>
              </template>

            </section>


          </section>
        </div>

        <!-- Partners -->
        <template x-if="project?.partners?.length">
          <div class="container container-100">
            <section class="project-partners p-40-50">
              <h3>Партнери</h3>

              <template x-for="p in project.partners" :key="p._id">
                <div class="project-partners-items">
                  <a x-show="p.link" :href="p.link" target="_blank" class="project-link">
                    <div>
                      <img x-show="p.logo" :src="p.logo" />
                      <span x-text="p.name"></span>
                    </div>
                  </a>
                </div>
              </template>
            </section>
          </div>
        </template>
    </section>


    <load src="./src/partials/projects-preview.html" />
    <load src="./src/partials/leaflet.html" />

  </main>


  <load src="./src/partials/footer.html" />
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
